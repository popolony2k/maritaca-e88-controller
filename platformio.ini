; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_ATOMS3
build_src_filter = +<*> -<hal/m5stickcplus2.cpp>
lib_deps =
    m5stack/M5Unified

; M5StickC Plus2 (ESP32-PICO-V3-02 — original ESP32 core, not S3).
; No dedicated PlatformIO board definition exists for this exact model yet;
; esp32-pico-devkitm-2 is the official Espressif devkit definition for the
; same chip (8MB flash) and gets the bootloader/partition table right.
; M5Unified does its own runtime board detection/pin-mapping regardless.
[env:m5stack-stickc-plus2]
platform = espressif32
board = esp32-pico-devkitm-2
framework = arduino
monitor_speed = 115200
build_flags = -DBOARD_STICKC_PLUS2
build_src_filter = +<*> -<hal/m5atoms3.cpp>
; esp32-pico-devkitm-2's default partition table assumes dual OTA app slots
; sized for a smaller flash, even though it knows the chip has 8MB — our
; firmware (~1.7MB) doesn't fit in either ~1.3MB slot. huge_app.csv gives a
; single ~3MB app partition (no OTA), which is what AtomS3's board
; definition already provides automatically.
board_build.partitions = huge_app.csv
lib_deps =
    m5stack/M5Unified
