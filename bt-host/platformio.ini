; Standalone headless build — NOT part of the main firmware's platformio.ini.
; Reads an 8BitDo (Switch mode, BR/EDR) gamepad via Bluepad32 and drives the
; drone over WiFi UDP, reusing the main firmware's comm/control sources
; directly from ../src (see main/CMakeLists.txt). No display, no M5Unified —
; mixing framework=arduino (main firmware) and framework=espidf (required by
; Bluepad32) in one PlatformIO project doesn't work, so this is a separate,
; parallel build flashed instead of the main firmware, not a mode within it.
;
; board = esp32dev: the M5StickC Plus2's ESP32-PICO-V3-02 is an original
; ESP32 core (same family as esp32dev); no M5StickC-specific board entry is
; needed since this build has no display/M5Unified code at all.
[platformio]
src_dir = main

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
; The platform's pinned esptool release (v5.0.0-dev1) has a packaging bug
; (missing package-postinstall.py) that breaks `pio run`. Override with a
; newer, working release.
platform_packages =
    pioarduino/tool-esptoolpy@https://github.com/pioarduino/esptool/releases/download/v5.3.0/esptool.zip
framework = espidf
board = esp32dev
monitor_speed = 115200
monitor_filters = direct
; sdkconfig.defaults' CONFIG_PARTITION_TABLE_CUSTOM_FILENAME alone wasn't
; enough — PlatformIO's own board_build.partitions setting overrides it,
; so set both to be sure.
board_build.partitions = partitions.csv
; Required by transitively-pulled esp_insights/esp_rainmaker components
; (optional features of the arduino-esp32 core's own dependency tree —
; unrelated to Bluepad32, but their build rules need these embedded
; regardless). Matches the upstream template's [env] block.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
